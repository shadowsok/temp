name: Extract resume text

on:
  push:
    paths:
      - "files/JosephMPerezResume.docx"
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc docx2txt python3-pip
          pip3 install python-docx

      - name: Make output dir
        run: mkdir -p ingestion

      - name: Extract with pandoc
        run: pandoc "files/JosephMPerezResume.docx" -t plain -o "ingestion/out-pandoc.txt"

      - name: Extract with docx2txt
        run: docx2txt "files/JosephMPerezResume.docx" "ingestion/out-docx2txt.txt"

      - name: Extract with python-docx
        run: |
          python3 - << 'PY'
          from docx import Document
          from pathlib import Path

          d = Document("files/JosephMPerezResume.docx")
          lines = []

          # Paragraphs
          for p in d.paragraphs:
              t = (p.text or '').strip()
              if t:
                  lines.append(t)

          # Tables (if any)
          for table in d.tables:
              for row in table.rows:
                  cells = [ (cell.text or '').strip() for cell in row.cells ]
                  cells = [ c for c in cells if c ]
                  if cells:
                      lines.append(" | ".join(cells))

          out = Path("ingestion/out-python-docx.txt")
          out.write_text("\n".join(lines).rstrip()+"\n", encoding="utf-8")
          PY

      - name: Commit results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Extract resume text from files/JosephMPerezResume.docx"
          file_pattern: ingestion/*.txt
