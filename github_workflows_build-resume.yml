name: Build resume
on:
  push:
    paths:
      - 'Joseph Michael Perez Resume.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.12'

      - name: Install LaTeX (for PDF export)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra

      - name: Convert to DOCX and PDF
        run: |
          mkdir -p build
          pandoc "Joseph Michael Perez Resume.md" --from gfm -o "build/Joseph Michael Perez Resume.docx"
          pandoc "Joseph Michael Perez Resume.md" --from gfm -o "build/Joseph Michael Perez Resume.pdf"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-outputs
          path: build/